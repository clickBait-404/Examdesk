services:
  postgres:
    image: postgres:16
    container_name: examdesk-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: examdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Himanshu1705

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: examdesk-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: examdesk-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    depends_on:
      - postgres
      - redis

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

volumes:
  postgres_data: