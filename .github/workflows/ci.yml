name: ExamDesk CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: examdesk
          POSTGRES_PASSWORD: examdesk
          POSTGRES_DB: examdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U examdesk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug backend
        run: |
          pwd
          ls -la
          python --version
          python -c "import os; print(os.getcwd())"
          python -c "import main; print('main imported successfully')"

      - name: Run Tests
        env:
          DATABASE_URL: postgresql+asyncpg://examdesk:examdesk@localhost:5432/examdesk_test
        run: |
          pytest